[package]
name = "gcp-calc"
version = "1.11.0"
description = "GCP-Calc"
authors = ["Bruno Albertini | Gestão Cultural Pro"]
license = "GPL-3.0-or-later"
repository = "https://github.com/cliqueprojeto/GCP-Calc"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gcp_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Linux: libera microfone (gravação de áudio nas notas) na WebView do WebKitGTK
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_4"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
