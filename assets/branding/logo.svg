<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GCP-Calc — ícone do app: cupom fiscal com selo de calculadora dourado, sobre fundo esmeralda profundo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11574c"/>
      <stop offset="1" stop-color="#0b4038"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#021a16" flood-opacity=".45"/>
    </filter>
    <filter id="badge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021a16" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#bg)"/>
  <rect x="44" y="44" width="936" height="936" rx="208" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
  <g transform="translate(512 512) scale(1.02) translate(-558 -515)">
    <!-- cupom fiscal: papel marfim com borda serrilhada -->
    <g filter="url(#shadow)">
      <path d="M306 170 H638 Q676 170 676 208 V790 L650.5 822 L625 790 L599.5 822 L574 790 L548.5 822 L523 790 L497.5 822 L472 790 L446.5 822 L421 790 L395.5 822 L370 790 L344.5 822 L319 790 L293.5 822 L268 790 V208 Q268 170 306 170 Z" fill="#fbf6ea"/>
    </g>
    <!-- cabeçalho do cupom -->
    <rect x="318" y="224" width="190" height="34" rx="17" fill="#0e4b42"/>
    <rect x="548" y="224" width="80" height="34" rx="17" fill="#0e4b42" opacity=".28"/>
    <!-- itens: descrição à esquerda, valor à direita -->
    <g stroke-linecap="round" stroke-width="26">
      <path d="M318 330 H446" stroke="#1d2b28" opacity=".42"/>
      <path d="M534 330 H628" stroke="#0e4b42"/>
      <path d="M318 398 H420" stroke="#1d2b28" opacity=".42"/>
      <path d="M548 398 H628" stroke="#0e4b42"/>
      <path d="M318 466 H460" stroke="#1d2b28" opacity=".42"/>
      <path d="M520 466 H628" stroke="#0e4b42"/>
    </g>
    <!-- picote e total -->
    <path d="M318 536 H628" stroke="#1d2b28" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 26" opacity=".55"/>
    <path d="M318 606 H404" stroke="#1d2b28" stroke-width="36" stroke-linecap="round"/>
    <path d="M318 676 H372" stroke="#1d2b28" stroke-width="22" stroke-linecap="round" opacity=".35"/>
    <!-- selo de calculadora dourado -->
    <g filter="url(#badge)">
      <rect x="548" y="560" width="300" height="300" rx="78" fill="#f2b33d" stroke="#0e4b42" stroke-width="20"/>
      <g stroke="#0e4b42" stroke-width="26" stroke-linecap="round">
        <path d="M624 650 H680 M652 622 V678"/>
        <path d="M718 650 H774"/>
        <path d="M630 736 L674 780 M674 736 L630 780"/>
        <path d="M718 744 H774 M718 774 H774"/>
      </g>
    </g>
  </g>
</svg>
